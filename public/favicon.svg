<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Deep radial gradient background -->
    <radialGradient id="rome-bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#242429"/>
      <stop offset="60%" stop-color="#101013"/>
      <stop offset="100%" stop-color="#040405"/>
    </radialGradient>

    <!-- Metallic silver gradient for socialist symbols -->
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Crisp elevation shadow -->
    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- ================= NEO-BRUTALIST MEDALLION BORDER ================= -->
  <rect x="3" y="3" width="114" height="114" rx="26" fill="url(#rome-bg)" stroke="#ffffff" stroke-width="3.5"/>
  <rect x="7.5" y="7.5" width="105" height="105" rx="21" fill="none" stroke="#27272a" stroke-width="1.2"/>
  <circle cx="60" cy="60" r="51" fill="none" stroke="#52525b" stroke-width="1" stroke-dasharray="3 3.5" opacity="0.4"/>

  <g filter="url(#badge-glow)">
    <!-- ================= 1. ROMAN LAUREL WREATH (VÒNG NGUYỆT QUẾ THÀNH ROME) ================= -->
    <!-- Left Laurel Branch -->
    <path d="M 36,98 C 24,84 18,66 22,46 C 24,36 30,28 38,22" fill="none" stroke="#a1a1aa" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 32,92 Q 22,90 24,82 Q 31,84 32,92 Z" fill="#ffffff"/>
    <path d="M 26,82 Q 16,77 20,70 Q 27,73 26,82 Z" fill="#e4e4e7"/>
    <path d="M 22,70 Q 13,62 18,54 Q 25,58 22,70 Z" fill="#ffffff"/>
    <path d="M 20,56 Q 13,46 20,38 Q 26,44 20,56 Z" fill="#e4e4e7"/>
    <path d="M 23,42 Q 19,30 28,26 Q 31,34 23,42 Z" fill="#ffffff"/>
    <path d="M 30,30 Q 30,19 40,19 Q 40,28 30,30 Z" fill="#e4e4e7"/>
    <path d="M 40,21 Q 44,14 50,18 Q 46,24 40,21 Z" fill="#ffffff"/>

    <!-- Right Laurel Branch -->
    <path d="M 84,98 C 96,84 102,66 98,46 C 96,36 90,28 82,22" fill="none" stroke="#a1a1aa" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 88,92 Q 98,90 96,82 Q 89,84 88,92 Z" fill="#ffffff"/>
    <path d="M 94,82 Q 104,77 100,70 Q 93,73 94,82 Z" fill="#e4e4e7"/>
    <path d="M 98,70 Q 107,62 102,54 Q 95,58 98,70 Z" fill="#ffffff"/>
    <path d="M 100,56 Q 107,46 100,38 Q 94,44 100,56 Z" fill="#e4e4e7"/>
    <path d="M 97,42 Q 101,30 92,26 Q 89,34 97,42 Z" fill="#ffffff"/>
    <path d="M 90,30 Q 90,19 80,19 Q 80,28 90,30 Z" fill="#e4e4e7"/>
    <path d="M 80,21 Q 76,14 70,18 Q 74,24 80,21 Z" fill="#ffffff"/>

    <!-- Ribbon Knot at bottom of laurel wreath -->
    <path d="M 54,97 C 57,99 63,99 66,97 C 68,95 65,93 60,94 C 55,93 52,95 54,97 Z" fill="#ffffff"/>
    <path d="M 53,98 L 47,105 L 52,106 L 56,100 Z" fill="#d4d4d8"/>
    <path d="M 67,98 L 73,105 L 68,106 L 64,100 Z" fill="#d4d4d8"/>

    <!-- ================= 2. ROMAN COLOSSEUM / ARCHITECTURE (ĐẤU TRƯỜNG THÀNH ROME) ================= -->
    <!-- Colosseum Base & Tier Silhouette (Characteristic broken outer wall of Roman amphitheater) -->
    <path d="
      M 31,90
      L 31,73
      L 33,73 L 33,65 L 43,65 L 43,69 L 53,69 L 53,73 L 89,73
      L 89,90
      Z"
      fill="#18181b" stroke="#a1a1aa" stroke-width="1.5"/>

    <!-- Cornice divider lines -->
    <line x1="31" y1="81" x2="89" y2="81" stroke="#52525b" stroke-width="1.2"/>
    <line x1="31" y1="73" x2="89" y2="73" stroke="#71717a" stroke-width="1.2"/>

    <!-- Upper Attic Pilasters on high wall of Colosseum -->
    <line x1="34" y1="65" x2="34" y2="73" stroke="#e4e4e7" stroke-width="1"/>
    <line x1="38" y1="65" x2="38" y2="73" stroke="#e4e4e7" stroke-width="1"/>
    <line x1="42" y1="65" x2="42" y2="73" stroke="#e4e4e7" stroke-width="1"/>
    <line x1="47" y1="69" x2="47" y2="73" stroke="#e4e4e7" stroke-width="1"/>
    <line x1="51" y1="69" x2="51" y2="73" stroke="#e4e4e7" stroke-width="1"/>

    <!-- Tier 2 Roman Arches (Cổng vòm La Mã tầng 2) -->
    <g fill="#3f3f46" stroke="#d4d4d8" stroke-width="0.8">
      <path d="M 34,80 L 34,76 A 2.2,2.2 0 0,1 38.5,76 L 38.5,80 Z"/>
      <path d="M 41,80 L 41,76 A 2.2,2.2 0 0,1 45.5,76 L 45.5,80 Z"/>
      <path d="M 48,80 L 48,76 A 2.2,2.2 0 0,1 52.5,76 L 52.5,80 Z"/>
      <path d="M 55,80 L 55,76 A 2.2,2.2 0 0,1 59.5,76 L 59.5,80 Z"/>
      <path d="M 62,80 L 62,76 A 2.2,2.2 0 0,1 66.5,76 L 66.5,80 Z"/>
      <path d="M 69,80 L 69,76 A 2.2,2.2 0 0,1 73.5,76 L 73.5,80 Z"/>
      <path d="M 76,80 L 76,76 A 2.2,2.2 0 0,1 80.5,76 L 80.5,80 Z"/>
      <path d="M 83,80 L 83,76 A 2.2,2.2 0 0,1 87.5,76 L 87.5,80 Z"/>
    </g>

    <!-- Tier 1 Roman Ground Arches (Cổng vòm La Mã tầng trệt) -->
    <g fill="#09090b" stroke="#ffffff" stroke-width="1">
      <path d="M 33.5,89 L 33.5,84 A 2.5,2.5 0 0,1 38.5,84 L 38.5,89 Z"/>
      <path d="M 40.5,89 L 40.5,84 A 2.5,2.5 0 0,1 45.5,84 L 45.5,89 Z"/>
      <path d="M 47.5,89 L 47.5,84 A 2.5,2.5 0 0,1 52.5,84 L 52.5,89 Z"/>
      <path d="M 54.5,89 L 54.5,84 A 2.5,2.5 0 0,1 59.5,84 L 59.5,89 Z"/>
      <path d="M 61.5,89 L 61.5,84 A 2.5,2.5 0 0,1 66.5,84 L 66.5,89 Z"/>
      <path d="M 68.5,89 L 68.5,84 A 2.5,2.5 0 0,1 73.5,84 L 73.5,89 Z"/>
      <path d="M 75.5,89 L 75.5,84 A 2.5,2.5 0 0,1 80.5,84 L 80.5,89 Z"/>
      <path d="M 82.5,89 L 82.5,84 A 2.5,2.5 0 0,1 87.5,84 L 87.5,89 Z"/>
    </g>

    <!-- Colosseum Foundation stone podium -->
    <rect x="29" y="89" width="62" height="3" fill="#d4d4d8" rx="1"/>

    <!-- ================= 3. SOCIALIST HAMMER & SICKLE (BÚA VÀ LIỀM TRUNG TÂM) ================= -->
    <!-- Hammer (Búa công nhân) -->
    <!-- Hammer Handle -->
    <path d="M 42,79 L 38,75 L 68,44 L 72,48 Z" fill="url(#silver-grad)" stroke="#09090b" stroke-width="0.8"/>
    <circle cx="40" cy="77" r="2.5" fill="#ffffff"/>

    <!-- Hammer Head Crossbar -->
    <path d="M 61,41 L 74,28 L 82,36 L 69,49 Z" fill="#ffffff" stroke="#09090b" stroke-width="0.8"/>
    <!-- Striking face bevel -->
    <path d="M 74,28 L 77,25 L 85,33 L 82,36 Z" fill="#f4f4f5"/>
    <!-- Back peen -->
    <path d="M 61,41 L 58,44 L 66,52 L 69,49 Z" fill="#a1a1aa"/>

    <!-- Sickle (Liềm nông dân) -->
    <!-- Wooden Handle -->
    <path d="M 49,74 L 54,79 L 48,89 L 43,84 Z" fill="#ffffff" stroke="#09090b" stroke-width="0.8"/>
    <circle cx="45.5" cy="86.5" r="1.5" fill="#09090b"/>

    <!-- Sickle Blade (Arc sweeping up and over hammer) -->
    <path d="
      M 52,72
      C 40,65 34,48 46,33
      C 56,21 76,20 89,31
      C 92,33.5 93,35.5 92.5,35.5
      C 91.5,35.5 88,32.5 82,30.5
      C 69,26 54,30 46,40
      C 37,51 43,64 53,70
      Z"
      fill="url(#silver-grad)"
      stroke="#09090b"
      stroke-width="0.8"/>

    <!-- Blade tip highlight -->
    <path d="M 89,31 C 93,35.5 92.5,35.5 88,32.5 Z" fill="#ffffff"/>

    <!-- ================= 4. SOCIALIST STAR (NGÔI SAO NĂM CÁNH) ================= -->
    <polygon points="60,11 63,18.5 71,18.5 64.5,23.5 67,31 60,26.5 53,31 55.5,23.5 49,18.5 57,18.5" fill="#ffffff" stroke="#09090b" stroke-width="0.6"/>
  </g>
</svg>
